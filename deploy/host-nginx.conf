server {
    listen 443 ssl;
    server_name benincosa.com www.benincosa.com;

    ssl_certificate /etc/letsencrypt/live/benincosa.com-0001/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/benincosa.com-0001/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_timeout 1d;
    ssl_session_cache shared:BenincosaSSL:10m;
    ssl_session_tickets off;

    add_header Strict-Transport-Security "max-age=15768000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location = /p90x {
        return 301 /p90x/;
    }

    location ^~ /p90x/ {
        root /usr/share/nginx/html/benincosa;
        autoindex on;
        autoindex_exact_size off;
        autoindex_localtime on;
    }

    location = /p90x3 {
        return 301 /p90x3/;
    }

    location ^~ /p90x3/ {
        root /usr/share/nginx/html/benincosa;
        autoindex on;
        autoindex_exact_size off;
        autoindex_localtime on;
    }

    location / {
        proxy_pass http://127.0.0.1:8088;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 80;
    server_name benincosa.com www.benincosa.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}
